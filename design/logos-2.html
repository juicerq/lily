<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@500..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0}
svg{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border-radius:22px;background:#000;box-shadow:0 0 0 1px #1d1d1d;padding:16px;color:#f0f0f0;font-family:'Space Mono',ui-monospace,monospace;display:flex;flex-direction:column;gap:14px;--t1:#f0f0f0;--t2:#b4b4b4;--t3:#767676;--t4:#464646}
.top{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#6a6a6a}
.top b{color:#f0f0f0;font-weight:700}
.hero{height:150px;border-radius:16px;background:radial-gradient(circle,#161616 1px,transparent 1.5px) 0 0/10px 10px,#070707;display:grid;place-items:center}
.hero svg{width:96px;height:96px}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px;background:#0e0e0e}
.chip.light{background:#f0f0f0;--t1:#9a9a9a;--t2:#5e5e5e;--t3:#2e2e2e;--t4:#0a0a0a}
.chip svg:nth-child(1){width:16px;height:16px}
.chip svg:nth-child(2){width:24px;height:24px}
.chip svg:nth-child(3){width:32px;height:32px}
.hd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;box-shadow:inset 0 0 0 1px #1d1d1d;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.logo{display:flex;align-items:center;gap:8px;font-family:'Doto',monospace;font-weight:900;font-size:18px;letter-spacing:0;text-transform:lowercase}
.logo svg{width:18px;height:18px}
.date{color:#6a6a6a}
.why{font-size:11px;color:#8a8a8a;line-height:1.5;margin:0}
</style>
</head>

<main class="grid" id="root"></main>
<script>
const L=[
['e','E','Cinco pétalas','Pétala central alta, duas médias, duas baixas quase deitadas. A silhueta clássica da flor de lótus.'],
['f','F','Camadas','Duas fileiras de pétalas, a de trás mais escura, e uma lâmina de água embaixo. Flor aberta, mais cheia.'],
['h','H','Curvas','Pétalas laterais curvam para fora na ponta, como a flor abrindo. Mais leve e com movimento.'],
['i','I','Vista de cima','Dois anéis de 8 pétalas e miolo escuro. A luz vem do canto superior esquerdo.']];
const use=(id,n)=>Array.from({length:n},()=>`<svg><use href="#${id}"/></svg>`).join('');
document.getElementById('root').innerHTML=L.map(([id,k,name,why])=>`
<section class="card">
  <div class="top"><span><b>${k}</b> · ${name}</span><span>64 × 64</span></div>
  <div class="hero">${use(id,1)}</div>
  <div class="sizes"><div class="chip">${use(id,3)}</div><div class="chip light">${use(id,3)}</div></div>
  <div class="hd"><span class="logo">${use(id,1)}lotus</span><span class="date">dom, 1 nov</span></div>
  <p class="why">${why}</p>
</section>`).join('');
</script>
